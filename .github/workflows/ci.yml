name: Marketplace CI

on:
  push:
    branches:
      - main
      - development/architecture-alignment
      - 'feat/**'
  pull_request:
    branches:
      - main
      - development/architecture-alignment

permissions:
  contents: read

concurrency:
  group: marketplace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
